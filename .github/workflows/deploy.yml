name: Deploy to GitHub Pages

# Pages serves the `gh-pages` branch, which until now was built and pushed by
# hand — so merged work could sit undeployed. This builds on every push to
# main and publishes the result.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Publish even when the built output is identical. Pages only
          republishes on a new deployment, so a rebuild alone cannot bring a
          site back — after a repository rename, for instance.
        type: boolean
        default: false

permissions:
  contents: write

# Never let two deploys race for the same branch.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` runs `tsc -b` first, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "::error::dist/404.html missing (SPA routing would break)"; exit 1; }
          test -f dist/.nojekyll  || { echo "::error::dist/.nojekyll missing (Pages would skip _-prefixed assets)"; exit 1; }
          ls -la dist

      # Commit onto the existing gh-pages history rather than force-pushing a
      # fresh orphan, so previous deploys stay inspectable.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a push; only a hand-run dispatch can set it.
          FORCE_PUBLISH: ${{ inputs.force }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git clone --branch gh-pages --single-branch --depth 1 "$remote" gh-pages-checkout \
            || { mkdir gh-pages-checkout && git -C gh-pages-checkout init -q && git -C gh-pages-checkout checkout -qb gh-pages; }

          # Replace the published tree wholesale, keeping .git.
          find gh-pages-checkout -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. gh-pages-checkout/

          cd gh-pages-checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # An unchanged build normally means there is nothing to publish, and
            # stopping here keeps gh-pages free of no-op commits. But Pages only
            # republishes when it sees a new deployment, so when the site itself
            # needs waking — after a repository rename, say — that guard is the
            # thing standing in the way. `force` is the way past it, and it is
            # only ever set by hand on a workflow_dispatch run.
            # Defaulted, not bare: the script runs under `set -u`, and an
            # unset variable there would fail every deploy rather than just
            # this branch.
            if [ "${FORCE_PUBLISH:-}" = "true" ]; then
              echo "No change in built output; forcing a deployment anyway."
              git commit --allow-empty -m "Redeploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME} (forced)"
            else
              echo "No change in built output; nothing to deploy."
              echo "Re-run this workflow with 'force' to publish anyway."
              exit 0
            fi
          else
            git commit -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          fi
          git push "$remote" gh-pages
