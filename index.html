  <div class="mid"><div class="pulse"></div>
    <div class="number" id="num">...</div>
    <div class="label">Total Participants</div>
  </div>
  <div class="updated" id="upd">Connecting...</div>
</div>
<script>
  // How often this page re-reads the number (seconds).
  var REFRESH = 30;
  var displayed = 0;
  var numEl = document.getElementById('num');
  var updEl = document.getElementById('upd');

  function fmt(n){ return n.toLocaleString('en-US'); }

  function animateTo(target){
    var start = displayed, diff = target - start;
    if(diff === 0){ numEl.textContent = fmt(target); return; }
    var dur = 900, t0 = performance.now();
    function step(t){
      var p = Math.min(1,(t-t0)/dur);
      var e = 1 - Math.pow(1-p,3);
      numEl.textContent = fmt(Math.round(start + diff*e));
      if(p<1) requestAnimationFrame(step); else displayed = target;
    }
    requestAnimationFrame(step);
  }

  function load(){
    // Cache-bust so we get the freshest count.json, not a CDN copy.
    fetch('count.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(typeof d.count === 'number'){ animateTo(d.count); }
        var when = d.updatedAt ? new Date(d.updatedAt) : new Date();
        updEl.textContent = 'Updated ' + when.toLocaleString();
      })
      .catch(function(){ updEl.textContent = 'Waiting for data...'; });
  }

  load();
  setInterval(load, REFRESH * 1000);
</script>
